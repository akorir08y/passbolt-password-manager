# Passbolt CE Docker Compose template
# Copy to docker-compose-ce.yaml and fill in your values

version: '3.7'

services:
  passbolt:
    image: passbolt/passbolt:latest-ce
    restart: unless-stopped
    depends_on:
      - db
    environment:
      APP_FULL_BASE_URL: https://passbolt.yourdomain.com   # CHANGE
      DATASOURCES_DEFAULT_HOST: db
      DATASOURCES_DEFAULT_USERNAME: passbolt
      DATASOURCES_DEFAULT_PASSWORD: your_db_password       # CHANGE
      DATASOURCES_DEFAULT_DATABASE: passbolt
      EMAIL_DEFAULT_FROM_NAME: "YourCompany Passbolt"      # CHANGE
      EMAIL_DEFAULT_FROM: passbolt@yourdomain.com          # CHANGE
      EMAIL_TRANSPORT_DEFAULT_HOST: live.smtp.mailtrap.io  # CHANGE if not Mailtrap
      EMAIL_TRANSPORT_DEFAULT_PORT: 587
      EMAIL_TRANSPORT_DEFAULT_USERNAME: your_smtp_username # CHANGE
      EMAIL_TRANSPORT_DEFAULT_PASSWORD: your_smtp_password # CHANGE
      EMAIL_TRANSPORT_DEFAULT_TLS: true
    volumes:
      - passbolt_gpg:/etc/passbolt/gpg
      - passbolt_jwt:/etc/passbolt/jwt
      # Uncomment for HTTPS (after obtaining Let's Encrypt certs)
      - /etc/letsencrypt/live/yourdomain.com/fullchain.pem:/etc/ssl/certs/certificate.crt:ro
      # - /etc/letsencrypt/live/yourdomain.com/privkey.pem:/etc/ssl/certs/certificate.key:ro
    ports:
      - "80:80"
      # - "443:443"  # Uncomment when HTTPS is enabled

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: your_root_password             # CHANGE
      MYSQL_DATABASE: passbolt
      MYSQL_USER: passbolt
      MYSQL_PASSWORD: your_db_password                    # CHANGE (same as above)
    volumes:
      - passbolt_db:/var/lib/mysql

volumes:
  passbolt_gpg:
  passbolt_jwt:
  passbolt_db: